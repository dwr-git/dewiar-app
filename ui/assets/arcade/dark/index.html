<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<title>Кто боится темноты</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/arcade.css">
<style>
/* чёрно-белая игра с одним тёплым акцентом: карточка — графит, заголовок — молочный, кнопка — янтарь фонаря */
:root.tone-dark .card { background: rgba(14, 14, 16, .62); border-color: rgba(255, 255, 255, .1); }
:root.tone-dark .card h2 { background: none; color: #f4f1ea; -webkit-text-fill-color: #f4f1ea; letter-spacing: .01em; }
:root.tone-dark .card .kicker { color: rgba(255, 196, 92, .85); }
:root.tone-dark .card .record { color: #ffc65c; }
:root.tone-dark .go { background: #ffb72b; color: #17130b; box-shadow: 0 6px 24px rgba(255, 183, 43, .32); }
:root.tone-dark .overlay { background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, .12), rgba(0, 0, 0, .55)); }
</style>
