<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { padding: 0 0 30px; }
  .serif { font-family: "Lora", "PT Serif", "Georgia", "Noto Serif", "Times New Roman", serif; }
  .hero { border-radius: 24px; padding: 26px 26px 22px; background: linear-gradient(150deg, color-mix(in oklab, #E0A458 22%, transparent), transparent 60%), var(--panel); }
  .hero h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
  .hero > p { color: var(--muted); margin: 0 0 16px; max-width: 60ch; }
  .in { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .in textarea { flex: 1 1 360px; min-height: 54px; max-height: 260px; font-size: 15px; border-radius: 16px; padding: 14px 16px; resize: vertical; }
  .in .btn { padding: 13px 22px; border-radius: 14px; font-size: 14.5px; }
  .hint2 { margin: 10px 2px 0; font-size: 12.5px; color: var(--dim); }
  .err { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: color-mix(in oklab, var(--bad) 14%, transparent); font-size: 13.5px; }
  .recent h2 { font-size: 15px; margin: 26px 2px 12px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .it { position: relative; text-align: left; border: 0; cursor: pointer; border-radius: 18px; padding: 14px 16px 13px; background: var(--panel); color: var(--ink); display: grid; gap: 4px; transition: box-shadow .2s, transform .15s; }
  .it:hover { box-shadow: inset 0 0 0 1px color-mix(in oklab, #E0A458 50%, transparent); transform: translateY(-1px); }
  .it b { font-size: 14.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-right: 22px; }
  .it small { color: var(--dim); font-size: 12px; }
  .it .x { position: absolute; right: 8px; top: 8px; width: 24px; height: 24px; border-radius: 8px; border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 15px; }
  .it .x:hover { background: var(--field); color: var(--ink); }
  .empty { padding: 28px; border-radius: 18px; text-align: center; color: var(--muted); background: color-mix(in oklab, var(--panel) 60%, transparent); }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .bar .sp { flex: 1; }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { border: 0; background: none; padding: 6px 11px; border-radius: 9px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); }
  .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .paper { --pbg: var(--panel); --pink: var(--ink); --pmuted: var(--muted); border-radius: 26px; padding: clamp(24px, 5vw, 56px) clamp(18px, 6vw, 72px) 44px; background: var(--pbg); color: var(--pink); transition: background .25s, color .25s; }
  .paper[data-t="paper"] { --pbg: #fbf7ee; --pink: #2b261f; --pmuted: #7b705f; }
  .paper[data-t="sepia"] { --pbg: #f1e4c8; --pink: #3d3122; --pmuted: #806a4c; }
  .paper[data-t="night"] { --pbg: #14151b; --pink: #d9d5cc; --pmuted: #8d8a83; }
  .art { margin: 0 auto; max-width: var(--mw, 66ch); }
  .art .site { font: 700 12px/1 "Manrope", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #C9853A; margin-bottom: 14px; }
  .art h1 { font-size: calc(var(--fs) * 1.75); line-height: 1.2; margin: 0 0 12px; font-weight: 700; letter-spacing: -.01em; color: var(--pink); }
  .art .meta { color: var(--pmuted); font: 500 13px "Manrope", sans-serif; margin: 0 0 26px; padding-bottom: 20px; border-bottom: 1px solid color-mix(in oklab, var(--pink) 14%, transparent); }
  .art p { font-size: var(--fs); line-height: 1.72; margin: 0 0 1em; hyphens: auto; }
  .art h3 { font-size: calc(var(--fs) * 1.12); margin: 1.6em 0 .6em; color: var(--pink); }
  .art p:first-of-type::first-letter { float: left; font-size: 3.1em; line-height: .9; padding: .06em .1em 0 0; font-weight: 700; color: #C9853A; }
  .end { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 30px; padding-top: 22px; border-top: 1px solid color-mix(in oklab, var(--pink) 14%, transparent); }
  @media (max-width: 560px) { .bar .seg.w { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (v, a, b, c) => { const m = Math.abs(v) % 100, k = m % 10; return m > 10 && m < 20 ? c : k > 1 && k < 5 ? b : k === 1 ? a : c; };
const isUrl = (t) => /^https?:\/\/\S+$/i.test(t.trim());
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
let recent = [], prefs = { fs: 19, t: "studio", w: "m" }, cur = null;

function words(t) { return (t.match(/\S+/g) || []).length; }
function mins(t) { return Math.max(1, Math.round(words(t) / 180)); }

/* текст -> абзацы; короткая строка без точки в конце — подзаголовок */
function paras(text) {
  const blocks = String(text || "").replace(/\r/g, "").split(/\n\s*\n|\n(?=\S)/).map(x => x.replace(/\s+/g, " ").trim()).filter(Boolean);
  return blocks.map(b => b.length < 90 && !/[.!?…:;»"]$/.test(b) && /[А-ЯЁA-Z]/.test(b[0]) ? `<h3>${esc(b)}</h3>` : `<p>${esc(b)}</p>`).join("");
}

function home(msg) {
  cur = null;
  $("#app").innerHTML = `<section class="hero"><h1>Читалка</h1>
      <p>Вставьте ссылку на статью или сам текст — покажу его чисто и крупно, без меню и рекламы. Лира перескажет главное.</p>
      <div class="in"><textarea id="src" placeholder="https://… или текст статьи" aria-label="Ссылка или текст статьи"></textarea>
        <button class="btn primary" id="go">Читать</button></div>
      <p class="hint2">Ссылку читалка откроет по вашему нажатию; текст никуда не уходит.</p>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}</section>
    <section class="recent"><h2>Недавние</h2>${recent.length ? `<div class="list">${recent.map((r, i) => `<div class="it" role="button" tabindex="0" data-i="${i}"><b>${esc(r.title)}</b>
      <small>${esc(r.url ? host(r.url) : "свой текст")} · ${mins(r.text)} мин чтения</small><button class="x" data-x="${i}" title="Убрать" aria-label="Убрать">×</button></div>`).join("")}</div>`
      : `<div class="empty">Здесь будут статьи, которые вы открывали.</div>`}</section>`;
  const src = $("#src"), go = $("#go");
  const sync = () => { go.textContent = isUrl(src.value) ? "Открыть ссылку" : "Читать"; };
  src.oninput = sync; src.onkeydown = (e) => { if (e.key === "Enter" && (isUrl(src.value) || e.ctrlKey)) { e.preventDefault(); go.click(); } };
  go.onclick = open;
  document.querySelectorAll(".it").forEach(el => {
    el.onclick = (e) => { if (e.target.closest(".x")) return; show(recent[+el.dataset.i]); };
    el.onkeydown = (e) => { if (e.key === "Enter") show(recent[+el.dataset.i]); };
  });
  document.querySelectorAll(".x").forEach(b => b.onclick = async () => { recent.splice(+b.dataset.x, 1); await save(); home(); });
}

async function open() {
  const src = $("#src"), go = $("#go"), v = src.value.trim();
  if (!v) { src.focus(); return; }
  let a;
  if (isUrl(v)) {
    go.disabled = true; go.innerHTML = `<i class="spin"></i> Открываю…`;
    try { const r = await dewiar.readUrl(v); a = { url: r.url || v, title: r.title || host(v), text: r.text || "" }; }
    catch (e) { home("Не открылась: " + e.message); $("#src").value = v; return; }
    if (words(a.text) < 30) { home("На странице почти нет текста — возможно, статья за входом или собирается скриптами. Скопируйте текст и вставьте сюда."); $("#src").value = v; return; }
  } else {
    const first = v.split("\n").find(x => x.trim()) || "Без названия";
    a = { url: "", title: first.length < 120 ? first.trim() : first.slice(0, 80).trim() + "…", text: first.length < 120 ? v.slice(v.indexOf(first) + first.length) : v };
  }
  a.at = Date.now(); a.text = a.text.slice(0, 20000);
  recent = [a, ...recent.filter(r => !(r.url && r.url === a.url) && r.title !== a.title)].slice(0, 8);
  await save();
  show(a);
}

function show(a) {
  cur = a;
  $("#app").innerHTML = `<div class="bar">
      <button class="btn ghost" id="back">← Список</button><span class="sp"></span>
      <div class="seg" role="group" aria-label="Размер шрифта"><button id="fm" title="Мельче">A−</button><button id="fp" title="Крупнее">A+</button></div>
      <div class="seg w" role="group" aria-label="Ширина">${[["s", "Узко"], ["m", "Обычно"], ["l", "Широко"]].map(([k, t]) => `<button data-w="${k}" aria-pressed="${prefs.w === k}">${t}</button>`).join("")}</div>
      <div class="seg" role="group" aria-label="Фон">${[["studio", "Как студия", "var(--panel2)"], ["paper", "Бумага", "#fbf7ee"], ["sepia", "Сепия", "#f1e4c8"], ["night", "Ночь", "#14151b"]].map(([k, t, c]) => `<button data-t="${k}" aria-pressed="${prefs.t === k}" title="${t}"><i class="dot" style="background:${c}"></i></button>`).join("")}</div>
      <button class="btn primary" id="sum">✦ Пересказать</button></div>
    <article class="paper serif" data-t="${prefs.t}"><div class="art" style="--fs:${prefs.fs}px;--mw:${{ s: "56ch", m: "66ch", l: "84ch" }[prefs.w]}">
      ${a.url ? `<div class="site">${esc(host(a.url))}</div>` : ""}<h1>${esc(a.title)}</h1>
      <div class="meta">${mins(a.text)} мин чтения · ${words(a.text).toLocaleString("ru-RU")} ${plural(words(a.text), "слово", "слова", "слов")}</div>
      ${paras(a.text)}
      <div class="end"><button class="btn primary" id="sum2">✦ Пересказать</button>${a.url ? `<button class="btn ghost" id="orig">Открыть оригинал</button>` : ""}<button class="btn ghost" id="back2">К списку</button></div>
    </div></article>`;
  const re = () => { save(); show(a); };
  $("#back").onclick = $("#back2").onclick = () => home();
  $("#fm").onclick = () => { prefs.fs = Math.max(15, prefs.fs - 1); re(); };
  $("#fp").onclick = () => { prefs.fs = Math.min(28, prefs.fs + 1); re(); };
  document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { prefs.w = b.dataset.w; re(); });
  document.querySelectorAll(".bar [data-t]").forEach(b => b.onclick = () => { prefs.t = b.dataset.t; re(); });
  $("#sum").onclick = $("#sum2").onclick = () => retell(a);
  if ($("#orig")) $("#orig").onclick = () => dewiar.openUrl(a.url).catch(e => dewiar.toast(e.message));
}

function retell(a) {
  const q = a.url ? `Перескажи коротко, по пунктам, главное из статьи «${a.title}»: ${a.url}`
    : `Перескажи коротко, по пунктам, главное из этого текста «${a.title}»:\n\n${a.text.slice(0, 10000)}`;
  dewiar.ask(q).then(() => dewiar.toast("Лира пересказывает — ответ в «Чате»")).catch(e => dewiar.toast(e.message));
}

async function save() { try { await dewiar.store.set("recent", recent); await dewiar.store.set("prefs", prefs); } catch (e) { dewiar.toast(e.message); } }
(async () => {
  try { recent = (await dewiar.store.get("recent")) || []; prefs = Object.assign(prefs, (await dewiar.store.get("prefs")) || {}); } catch (e) { }
  home();
})();
</script>
</body>
</html>
