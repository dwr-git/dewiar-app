<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead8">
<title>Колючая почта</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/arcade.css">
<style>
/* карточки меню — как лист бумаги из игры: тёплая бумага, чернильные надписи, кнопка цвета мухомора */
:root.tone-light .card { background: rgba(255, 250, 240, .93); border-color: rgba(255, 255, 255, .8); box-shadow: 0 18px 44px rgba(70, 45, 30, .28); }
:root.tone-light .card h2 { background: linear-gradient(90deg, #c0662a, #d9534a); -webkit-background-clip: text; background-clip: text; }
:root.tone-light .card p { color: #6b5a50; }
:root.tone-light .card .kicker { color: #a08a7a; }
:root.tone-light .card .score { color: #5a3f35; }
:root.tone-light .card .record { color: #c0662a; }
:root.tone-light .card .keys { color: #8a7264; }
:root.tone-light .go { background: linear-gradient(135deg, #e2665c, #c94f48); box-shadow: 0 6px 20px rgba(201, 79, 72, .35); }
:root.tone-light .ghost { color: #5a3f35; background: rgba(90, 63, 53, .06); border-color: rgba(90, 63, 53, .18); }
:root.tone-light .overlay { background: radial-gradient(ellipse at 50% 45%, rgba(247, 240, 226, .08), rgba(120, 90, 70, .28)); }
</style>
</head>
<body>
<script src="../shared/arcade.js"></script>
<script src="game.js"></script>
</body>
</html>
