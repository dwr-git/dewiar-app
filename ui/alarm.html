<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dewiar — напоминание</title>
<link href="assets/fonts.css" rel="stylesheet">
<style>
  /* Окно-будильник: по центру экрана, поверх всех окон. Звонит ядро (слышно и без окна), окно — чтобы заметить
     и ответить одним нажатием: «Готово» или «Отложить». Enter, пробел, Esc — готово; 1–4 — отложить.
     Открывает его ui/app.py (show_alarm): напоминание приходит в адресе (id, text, title, rep, late, at, att), окно без
     рамки, а скругление 26px совпадает с формой окна ALARM_RADIUS там. Закрывает — api().close_alarm. */
  :root { --a1: #FFB547; --a2: #FF6A88; --ink: #F6F4FF; --muted: #B9B5CF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0c0a12; user-select: none; -webkit-user-select: none; }
  body { font: 15px/1.45 "Manrope", "Ubuntu", "Segoe UI", "Noto Sans", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 26px 30px 24px;
          background: radial-gradient(120% 80% at 50% 0%, rgba(255,150,90,.20) 0%, transparent 60%),
                      radial-gradient(90% 70% at 50% 120%, rgba(120,80,255,.18) 0%, transparent 60%),
                      linear-gradient(180deg, #17121f 0%, #0c0a12 100%);
          border: 1px solid rgba(255,190,120,.22); border-radius: 26px; }
  #wrap.missed { background: linear-gradient(180deg, #16151c 0%, #0c0b10 100%); }
  .bell { position: relative; width: 112px; height: 112px; flex: none; margin-bottom: 14px; }
  .bell .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a1); opacity: 0; animation: wave 2.2s ease-out infinite; }
  .bell .ring:nth-child(2) { animation-delay: .73s; } .bell .ring:nth-child(3) { animation-delay: 1.46s; }
  @keyframes wave { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
  .bell .core { position: absolute; inset: 18px; border-radius: 50%; display: grid; place-items: center;
                background: radial-gradient(circle at 35% 30%, #ffd59a 0%, var(--a1) 35%, var(--a2) 100%);
                box-shadow: 0 0 40px rgba(255,140,90,.55), inset 0 -6px 14px rgba(0,0,0,.25); }
  .bell svg { width: 40px; height: 40px; animation: shake 1.1s ease-in-out infinite; transform-origin: 50% 10%; }
  @keyframes shake { 0%,55%,100% { transform: rotate(0); } 10% { transform: rotate(16deg); } 20% { transform: rotate(-14deg); }
                     30% { transform: rotate(10deg); } 40% { transform: rotate(-6deg); } }
  .missed .bell .ring, .done .bell .ring { animation: none; opacity: 0; }
  .missed .bell svg, .done .bell svg { animation: none; }
  .missed .bell .core { background: radial-gradient(circle at 35% 30%, #c9c6d8 0%, #8d89a6 60%, #5b5770 100%); box-shadow: none; }
  .done .bell .core { background: radial-gradient(circle at 35% 30%, #b8ffd9 0%, #3ad29f 60%, #1c9e74 100%); box-shadow: 0 0 40px rgba(58,210,159,.45); }
  #kind { font: 600 12.5px/1 "Manrope", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--a1); }
  .missed #kind { color: var(--muted); }
  #time { font: 700 44px/1.05 "Unbounded", "Manrope", sans-serif; letter-spacing: .02em; margin: 8px 0 4px; }
  #text { font: 600 22px/1.3 "Manrope", sans-serif; text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box;
          -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; }
  #sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; min-height: 19px; text-align: center; }
  /* №383 (28.10, Windows 11): «перекрывает поле с наименованием задачи, вторую строку не видно» — при масштабе экрана
     125–150 % окно ниже, чем задумано, и текст сжимался под кнопками. Текст и кнопки не сжимаются; в низком окне —
     колокол и время меньше, а не текст */
  #kind, #time, #text, #sub, #ok, #snooze { flex-shrink: 0; }
  @media (max-height: 470px) { .bell { width: 76px; height: 76px; margin-bottom: 6px; } .bell .core { inset: 12px; } .bell svg { width: 30px; height: 30px; }
    #time { font-size: 36px; margin: 4px 0 2px; } #text { font-size: 20px; } #wrap { padding-top: 18px; padding-bottom: 18px; } }
  @media (max-height: 400px) { .bell { display: none; } }
  .grow { flex: 1; }
  #ok { width: 100%; height: 54px; border: 0; border-radius: 16px; cursor: pointer; color: #1a0f0a;
        font: 700 17px/1 "Manrope", sans-serif; letter-spacing: .01em;
        background: linear-gradient(135deg, #ffd08a 0%, var(--a1) 40%, var(--a2) 100%);
        box-shadow: 0 10px 28px rgba(255,120,100,.35); transition: transform .12s, filter .12s; }
  #ok:hover { filter: brightness(1.06); } #ok:active { transform: scale(.98); }
  .missed #ok { background: rgba(255,255,255,.12); color: var(--ink); box-shadow: none; }
  #snooze { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
  #snooze button { flex: 1; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); cursor: pointer;
                   background: rgba(255,255,255,.06); color: var(--ink); font: 600 13.5px/1 "Manrope", sans-serif; transition: background .12s; }
  #snooze button:hover { background: rgba(255,255,255,.13); }
  #hint { margin-top: 10px; color: rgba(185,181,207,.65); font-size: 12px; text-align: center; }
  #x { position: absolute; top: 12px; right: 14px; width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer;
       background: rgba(255,255,255,.06); color: var(--muted); font-size: 16px; line-height: 30px; }
  #x:hover { background: rgba(255,255,255,.14); color: #fff; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* вложения напоминания (картинки, файлы из заметки — core reminder_files): нажатие — открыть большой и выключить звонок */
  #att { width: 100%; margin-top: 14px; display: none; }
  .has-att #att { display: block; }
  .has-att .bell { width: 84px; height: 84px; margin-bottom: 8px; }
  .has-att .bell .core { inset: 14px; } .has-att .bell svg { width: 32px; height: 32px; }
  .has-att #time { font-size: 36px; margin: 4px 0 2px; }
  .has-att #text { font-size: 20px; -webkit-line-clamp: 2; }
  #pics { display: flex; gap: 8px; justify-content: center; }
  #pics button { position: relative; flex: 0 1 128px; height: 86px; padding: 0; border-radius: 12px; cursor: zoom-in; overflow: hidden;
                 border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06) center/cover no-repeat;
                 transition: transform .12s, border-color .12s; }
  #pics button:hover { transform: translateY(-1px); border-color: rgba(255,190,120,.6); }
  #pics button.file { cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
                      color: var(--muted); font: 600 11.5px/1.2 "Manrope", sans-serif; padding: 6px; }
  #pics button.file svg { width: 22px; height: 22px; stroke: var(--a1); fill: none; stroke-width: 1.7; }
  #pics button.file span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pics .more { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12,10,18,.62);
                color: #fff; font: 700 18px/1 "Unbounded", sans-serif; }
  #all { display: block; margin: 8px auto 0; border: 0; background: none; cursor: pointer; color: var(--a1);
         font: 600 13px/1.3 "Manrope", sans-serif; padding: 2px 6px; border-radius: 6px; }
  #all:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="wrap">
  <button id="x" title="Закрыть (Esc)">✕</button>
  <div class="bell"><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="core"><svg viewBox="0 0 24 24" fill="none" stroke="#2a130b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div></div>
  <div id="kind">Напоминание</div>
  <div id="time">--:--</div>
  <div id="text"></div>
  <div id="sub"></div>
  <div id="att"><div id="pics"></div><button id="all"></button></div>
  <div class="grow"></div>
  <button id="ok">Готово</button>
  <div id="snooze">
    <button data-m="5">5 мин</button><button data-m="10">10 мин</button><button data-m="30">30 мин</button><button data-m="60">1 час</button>
  </div>
  <div id="hint">Или голосом: «понял», «отложи на 10 минут»</div>
</div>
<script src="assets/dewiar.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
// A — текущее напоминание: сначала из адреса, затем уточняется у ядра (alarm_get) и событиями alarm
let A = { id: q.get("id") || "", text: q.get("text") || "", title: q.get("title") || "Напоминание", repeat_text: q.get("rep") || "",
          late: q.get("late") === "1", at: q.get("at") || "", att: +(q.get("att") || 0) };
let ATT = { id: "", note: "", files: [] };
let finished = false;
const pad = (n) => String(n).padStart(2, "0");
function tick() { const d = new Date(); $("time").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function render() {
  $("kind").textContent = A.late ? "Пропущенное напоминание" : A.title;
  $("text").textContent = A.text && !["Будильник", "Таймер", "Напоминание"].includes(A.text) ? A.text :
    ({ "Будильник": "Пора вставать!", "Таймер": "Время вышло!" }[A.title] || A.text || "Напоминание");
  const parts = [];
  if (A.late && A.at) parts.push("было на " + A.at.slice(11, 16));
  if (A.repeat_text) parts.push("повтор: " + A.repeat_text);
  $("sub").textContent = parts.join(" · ");
  document.title = `⏰ ${$("text").textContent}`;
  loadAtt();
}
const esc = (t) => String(t || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c;
// картинки и файлы напоминания: до четырёх плиток, на последней «+N»; нажатие — звонок выключается, файл открывается
async function loadAtt() {
  const id = A.id;
  if (!id || ATT.id === id || ATT.busy === id) return;
  ATT.busy = id;
  let r = null;
  try { r = await core.call("reminder_files", { id }); } catch (e) { ATT.busy = ""; return; }   // ядро ещё не на связи — повторим по hello
  ATT.busy = "";
  if (A.id !== id) return;
  ATT = { id, note: r && r.note || "", files: r && r.files || [] };
  if (!ATT.files.length) { $("wrap").classList.remove("has-att"); return; }
  r = ATT;
  const show = r.files.slice(0, 4), rest = r.files.length - show.length;
  $("pics").innerHTML = show.map((f, i) => f.thumb
    ? `<button data-i="${i}" title="${esc(f.name)}" style="background-image:url('${f.thumb}')">${i === 3 && rest > 0 ? `<span class="more">+${rest + 1}</span>` : ""}</button>`
    : `<button class="file" data-i="${i}" title="${esc(f.name)}"><svg viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5"/></svg><span>${esc(f.name)}</span></button>`).join("");
  document.querySelectorAll("#pics button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i; openAtt(i === 3 && rest > 0 ? null : ATT.files[i]); });
  const n = r.files.length, pics = r.files.filter(f => f.thumb).length;
  $("all").textContent = pics === n ? `Открыть ${n > 1 ? `все ${n} ${plural(n, "картинку", "картинки", "картинок")}` : "картинку"} в заметке`
    : `Открыть заметку — ${n} ${plural(n, "вложение", "вложения", "вложений")}`;
  $("hint").textContent = pics ? "Нажмите на картинку — откроется во весь экран" : "Нажмите на файл — откроется в своей программе";
  $("wrap").classList.add("has-att");
}
// посмотреть вложение: звонок выключаем (человек уже здесь), окно закрываем — иначе оно поверх просмотра
async function openAtt(f) {
  if (!finished && !$("wrap").classList.contains("missed")) { try { await core.call("alarm_ack", { id: A.id }); } catch (e) {} }
  finished = true;
  const a = api();
  try {
    if (f) await core.call("ws_open", { path: f.path });
    else if (a && a.open_note) a.open_note(ATT.note);
  } catch (e) {}
  close(150);
}
$("all").onclick = () => openAtt(null);
// окно без рамки закрывает программа; в браузере (нет pywebview) — window.close
function close(after = 0) { setTimeout(() => { const a = api(); if (a && a.close_alarm) a.close_alarm(A.id); else window.close(); }, after); }
function showDone(msg) {
  finished = true; $("wrap").classList.remove("missed"); $("wrap").classList.add("done");
  $("kind").textContent = "Готово"; $("sub").textContent = msg || ""; $("snooze").style.visibility = "hidden";
  $("ok").style.visibility = "hidden"; $("hint").textContent = ""; close(1400);
}
async function ack() {
  if (finished) return close();
  if ($("wrap").classList.contains("missed")) return close();     // звонок уже кончился — подтверждать нечего
  try { await core.call("alarm_ack", { id: A.id }); } catch (e) {}
  showDone("");
}
async function snooze(m) {
  let when = "";
  try {
    const r = await core.call("alarm_snooze", { id: A.id, minutes: m });
    if (r) when = r.when;
    else { const x = await core.call("reminder_add", { text: A.text, in_minutes: m, from: A.id }); when = x.when; }   // звонок уже не звенит (пропущен) — откладывать нечего, ставим новое напоминание
  } catch (e) {}
  showDone(when ? `Напомню ${when}` : "");
}
$("ok").onclick = ack; $("x").onclick = ack;
document.querySelectorAll("#snooze button").forEach((b, i) => b.onclick = () => snooze(+b.dataset.m));
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === "Escape" || e.key === " ") { e.preventDefault(); ack(); }
  const n = "1234".indexOf(e.key); if (n >= 0) snooze([5, 10, 30, 60][n]);
});
core.on("hello", async () => {
  try { const a = await core.call("alarm_get"); if (a && (!A.id || a.id === A.id)) { A = Object.assign(A, a); render(); } } catch (e) {}
});
core.on("alarm", (e) => { A = { id: e.id, text: e.text, title: e.title, repeat_text: e.repeat_text, late: e.late, at: e.at, att: e.att || 0 };
  finished = false; $("wrap").className = ""; $("snooze").style.visibility = ""; $("ok").style.visibility = ""; render(); });
// звонок завершился не отсюда (голосом, в другом окне или сам) — показать итог
core.on("alarm_done", (e) => {
  if (e.id !== A.id || finished) return;
  if (e.result === "missed") { $("wrap").classList.add("missed"); $("kind").textContent = "Пропущено";
    $("hint").textContent = "Звонок выключился сам — отложите, если ещё актуально"; return; }
  showDone(e.result === "snooze" && e.when ? `Напомню ${e.when}` : "");
});
render(); tick(); setInterval(tick, 1000);
setTimeout(() => $("ok").focus(), 200);
</script>
</body>
</html>
