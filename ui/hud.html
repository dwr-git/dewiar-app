<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dewiar</title>
<link href="assets/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="assets/skins.css">
<style>
  /* Виджет — матово-чёрная карточка; в ней живёт персонаж. Окно непрозрачное, скругление даёт форма окна,
     тень рисует система. Режим «значок» — отдельное круглое окно с той же страницей (?mode=mini).
     С ядром страница говорит сама (core из assets/dewiar.js), окнами управляет ui/app.py (api() — класс Api:
     положение, режим, трей, студия, окно напоминания). Сторож загрузки в app.py (page_guard) ищет #card, #orb
     и window.core — без них виджет сочтут незагрузившимся и спрячут. */
  :root { --persona: #8A9BFF; --ink: #F4F4F6; --muted: rgba(255,255,255,.62);
          /* сдержанная палитра (фирменные цвета владельца): стекло вместо фиолетовых заливок, акцент — холодный белый */
          --brand: linear-gradient(135deg, rgba(255,255,255,.22) 0%, rgba(193,235,255,.13) 100%);
          --glass: rgb(255 255 255 / 4%); --glass-shadow: 0 0 20px rgba(0,0,0,.5); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0b0e; overflow: hidden; height: 100%; user-select: none; -webkit-user-select: none; }
  body { font: 14px/1.45 "Manrope", "Ubuntu", "Noto Sans", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  #card { position: absolute; inset: 0; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; padding: 10px 14px 12px; cursor: grab;
          background: #0a0a0f; background: var(--skin-bg, #0a0a0f); }   /* тема — assets/skins.css (класс skin-… у body) */
  #card.dragging { cursor: grabbing; }
  /* Linux с композитором (ui/app.py composited_x11, &tw=1): окно прозрачное, углы скругляет сама страница — сглаженно,
     без ступенек формы окна (отзыв 19.10: «грубовато края стали» на светлой теме) */
  html.tw, html.tw body { background: transparent; }
  html.tw #card { border-radius: 28px; }
  /* Светлые темы: карточка сливалась со светлым окном под ней (студия в «Небесном», 20.10). Тени внутри (материал,
     портрет, панель) не трогаем — только сама карточка: тонкая линия по краю и светлый блик сверху, во всё окно.
     Было (0.38.94): в прозрачном окне тень снаружи и 6 px пустого края под неё — пока виджет тянули, Ubuntu закрашивал
     этот край тёмным фоном окна («тёмная кромка»). Пустого края больше нет — нечего закрашивать; отрисовку окна (GTK)
     не трогаем (0.38.95: правка фона окна заморозила виджет). */
  body.light:not(.mini) #card { box-shadow: inset 0 0 0 1px rgba(20,32,60,.075), inset 0 1px 0 rgba(255,255,255,.6); }   /* 20.10: «чуть менее заметную» — .13 → .075 */
  /* растянуть карточку за угол (отзыв 19.10); размер запоминается (ui.hud_w, ui.hud_h) */
  #grip { position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; z-index: 6; cursor: nwse-resize;
          display: grid; place-items: center; opacity: 0; transition: opacity .2s; color: var(--muted); touch-action: none; }
  html.tw #grip { right: 7px; bottom: 7px; }
  #card:hover #grip, #grip.on { opacity: .75; }
  #grip svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  body.mini #grip { display: none; }
  /* Темы (ui.skin, студия → «Оформление»): фон и стекло — в assets/skins.css; здесь только то, что меняет «Неон»
     сверх фона: фиолетовые кнопки и заливка строки состояния, как раньше */
  body.skin-neon { --brand: linear-gradient(135deg, #667eea 0%, #764ba2 100%); --glass: rgba(255,255,255,.065); --glass-shadow: 0 0 0 transparent; }
  body.skin-neon #bubble.live { background: var(--brand); }
  /* Светлые темы (body.light — skins.js light): тёмный текст, кнопки-акценты — глубокий чернильный, как в дизайн-студиях */
  body.light { --brand: linear-gradient(135deg, #2b2540 0%, #3b3560 100%); }
  body.light #bubble { color: var(--ink); }
  body.light #bubble::before { background: rgba(30,30,50,.25); }
  body.light #bubble.live::before { background: var(--ink); box-shadow: none; }
  body.light #bubble::after { background: linear-gradient(90deg, transparent, rgba(30,30,60,.55) 25%, rgba(30,30,60,.75) 50%, rgba(30,30,60,.55) 75%, transparent); }
  body.light #cap .bot.wait::before, body.light #cap .bot.wait::after, body.light #cap .bot.wait i { background: var(--ink); }
  body.light #cap .bot::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); }
  body.light #bot .rep, body.light #yn button:not(.yes), body.light #team button.cur { background: rgba(20,20,40,.07); color: var(--ink); }
  body.light #act, body.light #task, body.light #upd:not(.on), body.light #health, body.light #cloudlow { color: var(--ink); }
  body.light .btn:hover, body.light .btn:focus-visible, body.light #corner .btn:hover, body.light .ab:hover { color: var(--ink); background: rgba(20,20,40,.07); }
  body.light #corner .btn, body.light #corner-l .btn { color: var(--muted); }
  body.light #team { background: #fff; color: var(--ink); box-shadow: 0 14px 40px rgba(20,30,60,.18); }
  body.light #team button:hover { background: rgba(20,20,40,.05); }
  body.light .sep { background: rgba(20,20,40,.12); }
  body.light #ask textarea { color: var(--ink); }
  body.light #ask textarea::placeholder { color: var(--muted); }
  /* карточки напоминания, заметки, расхода и таймера (отзыв 18.10: в «Небесном» белые цифры и янтарная строка на светлом
     почти не читались) — на светлом: свой тон фона, тёмный текст, акценты темнее, кнопки — как остальные светлые */
  body.light #rem { background: linear-gradient(135deg, rgba(255,181,71,.2), rgba(255,106,136,.12)); box-shadow: 0 8px 22px rgba(20,30,60,.10); color: var(--ink); }
  body.light #rem.note { background: linear-gradient(135deg, rgba(138,155,255,.2), rgba(75,227,161,.12)); }
  body.light #rem .rt b { color: #9a5a00; }
  body.light #rem.note .rt b { color: #3d4bb8; }
  body.light #rem.money .rt b { color: #1f7a55; }
  body.light #rem button, body.light #tmr button { background: rgba(20,20,40,.08); color: var(--ink); }
  body.light #rem button:hover, body.light #tmr button:hover { background: rgba(20,20,40,.14); }
  body.light #tmr .tr { background: linear-gradient(135deg, rgba(126,232,250,.22), rgba(138,155,255,.16)); box-shadow: 0 8px 22px rgba(20,30,60,.10); }
  body.light #tmr .tr.end { background: linear-gradient(135deg, rgba(255,181,71,.28), rgba(255,106,136,.18)); }
  body.light #tmr .tt b { color: var(--ink); }
  body.light #tmr .tt span { color: var(--muted); }
  body.light #tmr svg.pg .well { fill: rgba(255,255,255,.55); }
  body.light #tmr svg.pg .bg { stroke: rgba(30,50,90,.09); }
  body.light #tmr svg.pg .tick { stroke: rgba(30,50,90,.22); }
  body.light #tmr svg.pg .s1 { stop-color: #1fb4d8; }
  body.light #tmr svg.pg .s2 { stop-color: #6a78f0; }
  body.light #tmr .tr.end svg.pg .s1 { stop-color: #f2a219; }
  body.light #tmr .tr.end svg.pg .s2 { stop-color: #ee5a78; }
  body.light #tmr svg.pg .bead { fill: #fff; filter: drop-shadow(0 1px 2px rgba(40,60,120,.35)); }
  /* неоморфизм: портрет — выпуклая «таблетка» из того же материала (две тени вокруг круга под обликом) */
  body.neu #orb::before { content: ""; position: absolute; left: 50%; top: 50%; width: 63%; height: 63%; transform: translate(-50%, -50%);
                         border-radius: 50%; background: var(--glass); box-shadow: 9px 9px 18px var(--neu-dark), -9px -9px 18px var(--neu-light); }
  body.neu.light #orb::before { width: 72%; height: 72%; }      /* светлый неоморфизм: поле материала вокруг портрета, без рамки */
  body.neu #orb canvas { position: relative; }
  body.neu .btn:hover, body.neu .ab:hover { background: transparent; box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); }
  body.neu #bar { opacity: .9; }
  /* как в наборах неоморфизма: поле ввода — вогнутое, акцент — чистый синий (точка «слушаю», черта «ваша очередь», кнопки) */
  body.neu { --brand: linear-gradient(135deg, #6a8dff 0%, #4f6cf0 100%); --accent: #5b7cff; }
  body.neu .askbox, body.neu .askbox:focus-within { background: var(--glass); box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); }
  body.neu #bubble.live::before { background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent); }
  body.neu #bubble::after { background: linear-gradient(90deg, transparent, var(--accent) 25%, #7fd6ff 50%, var(--accent) 75%, transparent); }
  body.neu #yn button:not(.yes) { background: var(--glass); box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  body.neu #team { background: var(--glass); box-shadow: 8px 8px 20px var(--neu-dark), -8px -8px 20px var(--neu-light); }

  #orb { position: relative; width: calc(228px * var(--ok, 1)); height: calc(228px * var(--ok, 1)); flex: none; cursor: pointer; transition: width .35s ease, height .35s ease; }
  #card.busy #orb { width: calc(150px * var(--ok, 1)); height: calc(150px * var(--ok, 1)); }        /* есть текст — сфера уступает место */
  #orb canvas { width: 100%; height: 100%; display: block; }

  /* Строка состояния под портретом — не кнопка: стекло, слева точка. Слушает, думает, говорит — точка светится и
     дышит. «Ваша очередь» (ответ закончен, можно говорить без имени) — под надписью тонкая светлая черта тает к центру:
     столько осталось ждать; кончилась — снова покой и сигнал «не слушаю». */
  #bubble { flex: none; margin-top: 4px; position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
            background: var(--glass); box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            color: #fff; border-radius: 999px; padding: 6px 18px 8px 15px; min-width: 120px; font-size: 13.5px; letter-spacing: .01em; transition: background .3s; }
  #bubble::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.28); transition: background .3s, box-shadow .3s; }
  #bubble.live { background: rgb(255 255 255 / 7%); }
  #bubble.live::before { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.75); animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #bubble > span { position: relative; z-index: 1; }
  #bubble::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 3px; height: 2px; border-radius: 2px;
                   background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75) 20%, rgba(193,235,255,.9) 50%, rgba(255,255,255,.75) 80%, rgba(255,255,255,0));
                   transform: scaleX(0); pointer-events: none; }
  #bubble.turn::after { animation: turn-left var(--turn, 8s) linear forwards; }
  @keyframes turn-left { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { #bubble.turn::after { animation: none; transform: scaleX(.6); } #bubble.live::before { animation: none; } }
  /* диктовка удержанием: красная точка записи и время; увели палец в сторону — «отпустите — отменить» */
  #bubble.hold { background: rgb(255 92 122 / 16%); }
  #bubble.hold::before { background: #ff5c7a; box-shadow: 0 0 10px rgba(255,92,122,.8); animation: breathe 1s ease-in-out infinite; }
  #bubble.hold.holdx { background: rgb(255 255 255 / 7%); }
  #bubble.hold.holdx::before { background: rgba(255,255,255,.5); box-shadow: none; animation: none; }
  #bubble.hold span { font-variant-numeric: tabular-nums; }
  #orb.holding { transform: scale(1.04); transition: transform .2s ease, width .35s ease, height .35s ease; }
  @media (prefers-reduced-motion: reduce) { #bubble.hold::before { animation: none; } #orb.holding { transform: none; } }
  #bubble b { font-family: "Unbounded", "Ubuntu", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .03em; }

  /* по центру, но не выше имени: при нехватке места «распорки» сжимаются до нуля, а лишнее уходит вниз (не наезжает на имя) */
  #mid { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; padding: 10px 0 8px; }
  #mid::before, #mid::after { content: ""; flex: 1 1 0; min-height: 0; margin: -4px 0; }
  #cap { display: none; flex: 0 1 auto; min-height: 0; width: 100%; overflow: hidden; padding: 10px 13px; border-radius: 18px; background: var(--glass); font-size: calc(13.5px * var(--dw-text, 1)); line-height: 1.42; cursor: default;
         box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #cap.show { display: flex; flex-direction: column; }
  #cap > * { flex: none; }
  #cap.err { background: rgba(255,90,120,.14); }
  #cap .bot:empty:not(.wait) { display: none; }
  /* ответ ещё готовится — три мягко мигающие точки цвета персонажа, а не «…» навсегда */
  #cap .bot.wait { height: 18px; display: flex; gap: 5px; align-items: center; }
  #cap .bot.wait::before, #cap .bot.wait::after, #cap .bot.wait i { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .25; animation: wdot 1.2s infinite ease-in-out; }
  #cap .bot.wait i { animation-delay: .2s; }
  #cap .bot.wait::after { animation-delay: .4s; }
  @keyframes wdot { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
  #cap .you { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #cap .you::before { content: "Вы: "; opacity: .75; }
  /* длинный ответ прокручивается колесом или пальцем; край, за которым есть ещё текст, плавно тает */
  #cap .bot { color: var(--ink); user-select: text; -webkit-user-select: text; white-space: pre-wrap; flex: 0 1 auto; min-height: 0;
              overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; margin-right: -8px; padding-right: 8px;
              scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  #cap .bot::-webkit-scrollbar { width: 4px; } #cap .bot::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 4px; }
  #cap .bot.ft { -webkit-mask-image: linear-gradient(transparent, #000 18px); mask-image: linear-gradient(transparent, #000 18px); }
  #cap .bot.fb { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
  #cap .bot.ft.fb { -webkit-mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 22px), transparent); }
  button.busy, .b.busy { opacity: .55; transform: scale(.94); transition: opacity .15s, transform .15s; }   /* нажатая кнопка ждёт ядро (не вся карточка!) */
  #bot .rep { display: block; margin-top: 8px; border: 0; border-radius: 10px; padding: 5px 10px; font: inherit; font-size: 12px;
             color: #fff; background: rgba(255,255,255,.12); cursor: pointer; }
  #bot .rep:hover { background: rgba(255,255,255,.2); }
  #bot .repask { display: flex; gap: 6px; flex-wrap: wrap; } #bot .repask .rep { display: inline-block; }
  #act { font-size: 12px; color: #D6E4F0; margin-bottom: 4px; display: none; }
  #act.on { display: block; }
  #act.bad { color: #ff8aa2; }
  #act::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; }
  #act.run::before { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #yn { display: none; flex: none; width: 100%; gap: 8px; }
  #yn.on { display: flex; }
  #yn button[hidden] { display: none; }
  #yn button { flex: 1; padding: 7px 0; border-radius: 12px; border: 0; background: rgba(255,255,255,.1); color: var(--ink); font: inherit; cursor: pointer; }
  #yn button.yes { background: var(--brand); color: #fff; font-weight: 600; }
  #note { text-align: center; font-size: 12.5px; line-height: 1.4; color: var(--muted); padding: 0 6px; cursor: default; }
  #note:empty, #cap.show ~ #note { display: none; }
  #note { white-space: pre-line; }
  /* первая загрузка: что готовится (status.loading) — полоска под строкой; доля неизвестна — бегущий отрезок */
  #ldbar { display: none; width: 56%; height: 3px; margin: 7px auto 0; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  #ldbar.on { display: block; } #cap.show ~ #ldbar { display: none; }
  #ldbar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(193,235,255,.95)); transition: width .5s; }
  #ldbar.run i { width: 30%; animation: ldrun 1.4s ease-in-out infinite; }
  @keyframes ldrun { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  #health { display: none; align-self: center; max-width: 100%; text-align: center; font-size: 12px; line-height: 1.35; padding: 5px 11px; border-radius: 12px;
            background: rgba(255,190,90,.14); color: #FFD9A0; cursor: default; }
  #health.on { display: block; } #health.bad { background: rgba(255,107,138,.16); color: #FFC2CF; }
  #health.calm { background: rgba(193,235,255,.08); color: #D6E4F0; }
  #health .dots::after { content: ""; animation: hdots 1.4s steps(4) infinite; }
  @keyframes hdots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  #health button { display: block; margin: 6px auto 0; border: 0; border-radius: 9px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer;
                   background: rgba(255,255,255,.14); color: var(--ink); } #health button:hover { background: rgba(255,255,255,.22); }
  #task, #upd { display: none; text-align: center; font-size: 12px; line-height: 1.35; color: #D6E4F0; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.05); cursor: pointer; }
  #task.on, #upd.on { display: block; }
  #task { text-align: left; padding: 8px 12px; }
  #rem { display: none; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 16px;
         background: linear-gradient(135deg, rgba(255,181,71,.16), rgba(255,106,136,.12)); box-shadow: 0 10px 30px rgb(0 0 0 / 20%); }
  #rem.show { display: flex; animation: remin .35s ease-out; }
  @keyframes remin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #rem.note { background: linear-gradient(135deg, rgba(138,155,255,.16), rgba(75,227,161,.10)); }
  #rem.note .rt b { color: #C9D0FF; }
  #rem .ri { font-size: 18px; }
  #rem .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.3; }
  #rem .rt b { color: #FFC978; font-weight: 600; }
  #rem .rt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rem button { border: 0; border-radius: 10px; padding: 6px 10px; cursor: pointer; background: rgba(255,255,255,.1); color: #fff; font: 600 12px/1 inherit; }
  #rem button:hover { background: rgba(255,255,255,.18); }
  /* Таймер с обратным отсчётом (как у Алисы: «поставь таймер на 5 минут» — цифры на экране, потом звонок): строка на
     каждый таймер (до трёх) — круг-прогресс, крупные цифры, название, ✕; вокруг облика — дуга ближайшего таймера,
     у значка — цифры поверх круга. Данные — напоминания вида timer (снимок hello и событие reminders), тик раз в секунду. */
  #tmr { display: none; flex-direction: column; gap: 6px; }
  #tmr.on { display: flex; }
  #tmr .tr { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 16px;
             background: linear-gradient(135deg, rgba(126,232,250,.13), rgba(138,155,255,.12)); box-shadow: 0 10px 30px rgb(0 0 0 / 18%);
             animation: remin .35s ease-out; }
  #tmr .tr.end { background: linear-gradient(135deg, rgba(255,181,71,.22), rgba(255,106,136,.18)); }
  /* Круг-циферблат (27.10, «бирюзовый кружок смотрится не очень»): мягкая лунка, по краю — дорожка и дуга остатка

  #more { display: none; flex: none; align-self: flex-end; margin: 4px -2px -2px 0; border: 0; background: none; color: var(--muted, rgba(255,255,255,.62));

  #reader { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; padding: 12px 10px 10px 14px;
            background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--persona) 12%, transparent) 0%, transparent 55%), var(--skin-bg, #0d0d12); }

             scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; font-size: calc(13.5px * var(--dw-text, 1)); line-height: 1.55; }
  #rd-body .q { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }

  #rd-body h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.45); margin: 4px 0 8px; font-weight: 600; }
  .steps { list-style: none; margin: 0 0 14px; }
  .steps li { position: relative; padding: 0 0 10px 20px; }
  .steps li::before { content: ""; position: absolute; left: 3px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #4BE3A1; }
  .steps li.run::before { background: #D6E4F0; animation: blink 1s infinite; }
  .steps li.error::before { background: #ff8aa2; } .steps li.declined::before { background: rgba(255,255,255,.35); }
  .steps li::after { content: ""; position: absolute; left: 6.5px; top: 18px; bottom: 2px; width: 1px; background: rgba(255,255,255,.1); }
  .steps li:last-child::after { display: none; }
  .steps .st { font-weight: 600; font-size: 13px; }
  .steps .sd { font: 12px/1.45 ui-monospace, "Ubuntu Mono", monospace; color: #D6E4F0; word-break: break-word; margin-top: 2px; }
  .steps .se { color: #ff8aa2; font-size: 12px; margin-top: 2px; }
  .steps details { margin-top: 3px; } .steps summary { font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .steps pre, .md pre { margin: 6px 0; }
  .md p { margin: 0 0 8px; } .md ul, .md ol { margin: 0 0 8px 18px; } .md li { margin-bottom: 3px; }
  .md .h { display: block; font-weight: 700; margin: 10px 0 6px; color: #fff; }
  .md code { font: 12.5px ui-monospace, "Ubuntu Mono", monospace; background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; }
  pre { position: relative; background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; overflow-x: auto;
        font: 12px/1.5 ui-monospace, "Ubuntu Mono", monospace; white-space: pre; scrollbar-width: thin; }
  pre code { background: none !important; padding: 0 !important; }
  pre .cp { position: sticky; float: right; left: 100%; top: 0; margin: -4px -6px 0 8px; border: 0; border-radius: 8px; padding: 3px 8px;
            background: rgba(255,255,255,.1); color: var(--ink); font: 11px "Manrope", sans-serif; cursor: pointer; }
  pre .cp:hover { background: rgba(255,255,255,.18); }
  /* «Ответ целиком» и ход работы в светлых темах (№233, 24.10: «при нажатии „ответ целиком“ текст плохо различим» —
     тёмный лист #0d0d12 и тёмные чернила «Небесного»): лист — цвет темы, чернила, приглушённые линии и код */

<script>
const $ = (id) => document.getElementById(id);
// карточка сама непрозрачная — диск-подложка не нужен; портрет сдержанный (белый край), голос — лучами (ui.voice_fx)
// voiceLevels: ядро шлёт уровень своего голоса, пока звук играет, — рот и лучи «говорят» только под звук, а не всё время
// «speaking» (голос с сервера приходит через несколько секунд после начала ответа)
const entity = new DewiarEntity($("cv"), { style: "nexus", color: "#8A9BFF", plate: false, tone: "mono", fx: "bars", voiceLevels: true, lookGain: 0.5 });
const VOICE_FX = ["bars", "pulse", "wave"];
function applyLook(ui) {                      // тема карточки и облика (assets/skins.*) + чем голос отзывается вокруг портрета
  ui = ui || {};
  const sk = window.dewiarSkin ? dewiarSkin(ui.skin) : { id: "brand" };
  (window.DEWIAR_SKIN_IDS || ["brand"]).forEach(k => document.body.classList.toggle("skin-" + k, k === sk.id));
  document.body.classList.toggle("light", !!sk.light);
  document.body.classList.toggle("neu", !!sk.neu);
  entity.tone = sk.tone || "mono";
  entity.fx = VOICE_FX.includes(ui.voice_fx) ? ui.voice_fx : "bars";
  applyZoom(ui);
  lookOn = ui.cursor_look === true;
  if (!lookOn) { clearTimeout(lookT); entity.look(null); }   // выключено — сразу прямо
}
/* Курсор над виджетом — персонаж смотрит на него: взгляд и лёгкий сдвиг лица (DewiarEntity.look, вдвое слабее, чем на
   телефоне). Только если включено в студии: «Оформление» → «Портрет смотрит на курсор» (ui.cursor_look; прежний ui.tilt был включён по умолчанию — не используем); по умолчанию — нет
   (отзыв 14.10: «на компьютере не нравится — оставить под флагом, по умолчанию выключено»). Круг не поворачивается. */
let lookOn = false, lookT = 0;
const lookCv = () => document.getElementById("cv");

const TL = { you: "", steps: [], answer: "" };
const escR = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function mdLite(t) {
  const parts = String(t || "").split(/```/);
  return parts.map((p, i) => {
    if (i % 2) { const code = p.replace(/^[\w+-]*\n/, ""); return `<pre><button class="cp">Копировать</button><code>${escR(code.replace(/\n$/, ""))}</code></pre>`; }

<script>
(function () {                                  // подсказки кнопок внутри карточки (см. #htip в стилях)
  const tip = document.getElementById("htip"); let cur = null, timer = 0;
  const hide = () => { clearTimeout(timer); tip.classList.remove("on"); cur = null; };
  document.addEventListener("mouseover", (e) => {
    const el = e.target.closest && e.target.closest("[title], [data-tip]");
    if (!el || el === cur) return;
    if (el.hasAttribute("title")) { el.dataset.tip = el.getAttribute("title"); el.removeAttribute("title"); }
    if (!el.dataset.tip) return;
    hide(); cur = el;
    timer = setTimeout(() => {

      tip.textContent = el.dataset.tip;
      const r = el.getBoundingClientRect(), w = Math.min(tip.offsetWidth, innerWidth - 20), h = tip.offsetHeight;
      const x = Math.max(10, Math.min(innerWidth - w - 10, r.left + r.width / 2 - w / 2));
      const y = r.bottom + 8 + h <= innerHeight - 6 ? r.bottom + 8 : Math.max(6, r.top - h - 8);
      tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.add("on");
    }, 550);
  });
  document.addEventListener("mouseout", (e) => { if (cur && !cur.contains(e.relatedTarget)) hide(); });
  ["mousedown", "wheel", "keydown", "blur"].forEach(k => addEventListener(k, hide, true));
})();
</script>
