<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Каляка</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/arcade.css">
<style>
/* Свои шрифты игры (без сети): Lora italic — «от руки», Unbounded — логотип. SIL OFL 1.1 — fonts/OFL-*.txt */
@font-face { font-family: "Lora"; font-style: italic; font-display: swap; font-weight: 400 700; src: url(fonts/lora-cyrillic-wght-italic.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "Lora"; font-style: italic; font-display: swap; font-weight: 400 700; src: url(fonts/lora-latin-wght-italic.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215; }
@font-face { font-family: "Unbounded"; font-style: normal; font-display: swap; font-weight: 200 900; src: url(fonts/unbounded-cyrillic-wght-normal.woff2) format("woff2"); unicode-range: U+0400-045F,U+0490-0491,U+04B0-04B1; }
/* светлый лист: карточка меню — тёмные чернила по светлому стеклу при любой теме Dewiar */
:root.tone-light .card { --ink: #1d3a9e; --muted: rgba(36, 50, 90, .72); color: var(--ink); }
:root.tone-light .card .score { color: #1d3a9e; }
:root.tone-light .ghost { color: #1d3a9e; background: rgba(29, 58, 158, .06); border-color: rgba(29, 58, 158, .22); }
</style>
</head>
<body>
<script src="../shared/arcade.js"></script>
<script src="game.js"></script>
</body>
</html>
